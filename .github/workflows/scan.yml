name: Nifty250 Scan -> Telegram

on:
  schedule:
    - cron: "30 10 * * 1-5"       # 16:00 IST -> swing scan (daily candle complete hone ke baad)
    - cron: "*/30 4-9 * * 1-5"    # har 30 min (9:30-15:30 IST) -> intraday scan (optional, neeche note dekho)
  workflow_dispatch:
    inputs:
      mode:
        description: "swing ya intraday"
        default: "swing"

permissions:
  contents: write                  # positions.json commit karne ke liye

concurrency:
  group: nifty-scan                # do scan ek saath nahi chalenge (positions.json race se bachne ke liye)
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SCAN_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 10 * * 1-5' && 'swing' || 'intraday') }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional: Settings -> Secrets and variables -> Actions -> Variables me badal sakte ho
      CAPITAL: ${{ vars.CAPITAL || '100000' }}
      RISK_PCT: ${{ vars.RISK_PCT || '1' }}
      MAX_POS: ${{ vars.MAX_POS || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_scan.py
      - name: Save positions state
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add positions.json
          if ! git diff --cached --quiet; then
            git commit -m "update positions [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || true
          fi
